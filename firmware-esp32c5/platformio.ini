; =============================================================================
;  Volvo D1-30 → NMEA 2000 Gateway — ESP32-C5 Firmware
;  Hardware: SmuqDev ESP32-C5 Dual Isolated CAN FD
;  Spec: ../design/esp32c5/volvo-d130-esp32c5-dual-can-spec-plan.md
; =============================================================================

[platformio]
default_envs = esp32c5-gateway

[env_base]
platform             = espressif32
board                = esp32c5
framework            = espidf
monitor_speed        = 115200
upload_speed         = 921600
board_build.partitions = partitions.csv

build_flags =
    -DTWAI_TX_QUEUE_LEN=40
    -DTWAI_RX_QUEUE_LEN=40
    -Wno-error=cpp
    -Wno-cpp

lib_deps =
    ; NMEA2000 4.24.1, pinned to a commit so later upstream changes cannot break the build
    https://github.com/ttlappalainen/NMEA2000.git#5b7b9fc3ccc18e30ebfba92da6486cffc6251595

[env:esp32c5-gateway]
extends = env_base
